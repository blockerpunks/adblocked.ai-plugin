name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets google-github-actions/auth request GitHub's OIDC token for Workload Identity Federation.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build zip
        run: npm run zip
        env:
          COMMIT_SHA: ${{ github.sha }}

      - name: Attach Chrome zip to release
        run: gh release upload "$TAG" .output/*-chrome.zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

      - name: Build Firefox zip
        run: npm run zip:firefox
        env:
          COMMIT_SHA: ${{ github.sha }}

      # Listed channel: publishes the version on addons.mozilla.org.
      # amo-metadata.json sets the listing fields (summary, categories, license) on every
      # release, so edit the listing there rather than in the AMO web UI.
      # web-ext is invoked via npx (not a dependency) because it pulls in vulnerable deps.
      # If AMO holds the version for manual review past the timeout, warn and skip the
      # XPI upload instead of failing; the listing updates once AMO approves it.
      - name: Sign Firefox build
        run: |
          set -o pipefail
          if ! npx --yes web-ext@10.7.0 sign \
            --channel listed \
            --amo-metadata amo-metadata.json \
            --source-dir .output/firefox-mv3 \
            --upload-source-code .output/*-sources.zip \
            --artifacts-dir .output/signed \
            --approval-timeout 900000 2>&1 | tee sign.log; then
            if grep -q 'Approval: timeout exceeded' sign.log; then
              echo "::warning::AMO approval pending; Firefox XPI not attached to the release"
            else
              exit 1
            fi
          fi
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      # AMO names the signed file after a hash; rename it to match the Chrome zip.
      - name: Attach Firefox XPI to release
        run: |
          if ! ls .output/signed/*.xpi >/dev/null 2>&1; then
            echo "::notice::No signed XPI; skipping"
            exit 0
          fi
          zip=$(ls .output/*-firefox.zip)
          xpi="$(basename "${zip%.zip}").xpi"
          mv .output/signed/*.xpi ".output/signed/$xpi"
          gh release upload "$TAG" ".output/signed/$xpi"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

      # Chrome Web Store, last so a Chrome failure can't hold up Firefox. Workload Identity
      # Federation swaps this job's OIDC token for a 10-minute Chrome Web Store access token;
      # no keys are stored. The GCP provider only admits release.yml on main of this repo.
      # Skipped until the repo variables are set.
      - name: Get Chrome Web Store access token
        id: gcp
        if: ${{ vars.CHROME_PUBLISHER_ID != '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 600s
          create_credentials_file: false

      - name: Submit to Chrome Web Store
        if: ${{ vars.CHROME_PUBLISHER_ID != '' }}
        run: npx wxt submit --chrome-zip .output/*-chrome.zip
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_PUBLISH_TYPE: DEFAULT_PUBLISH
          CHROME_SERVICE_ACCOUNT_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
