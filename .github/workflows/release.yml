name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build zip
        run: npm run zip
        env:
          COMMIT_SHA: ${{ github.sha }}

      - name: Attach Chrome zip to release
        run: gh release upload "$TAG" .output/*-chrome.zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

      - name: Build Firefox zip
        run: npm run zip:firefox
        env:
          COMMIT_SHA: ${{ github.sha }}

      # Listed channel: publishes the version on addons.mozilla.org.
      # web-ext is invoked via npx (not a dependency) because it pulls in vulnerable deps.
      # If AMO holds the version for manual review past the timeout, warn and skip the
      # XPI upload instead of failing; the listing updates once AMO approves it.
      - name: Sign Firefox build
        run: |
          set -o pipefail
          if ! npx --yes web-ext@10.7.0 sign \
            --channel listed \
            --source-dir .output/firefox-mv3 \
            --upload-source-code .output/*-sources.zip \
            --artifacts-dir .output/signed \
            --approval-timeout 900000 2>&1 | tee sign.log; then
            if grep -q 'Approval: timeout exceeded' sign.log; then
              echo "::warning::AMO approval pending; Firefox XPI not attached to the release"
            else
              exit 1
            fi
          fi
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      # AMO names the signed file after a hash; rename it to match the Chrome zip.
      - name: Attach Firefox XPI to release
        run: |
          if ! ls .output/signed/*.xpi >/dev/null 2>&1; then
            echo "::notice::No signed XPI; skipping"
            exit 0
          fi
          zip=$(ls .output/*-firefox.zip)
          xpi="$(basename "${zip%.zip}").xpi"
          mv .output/signed/*.xpi ".output/signed/$xpi"
          gh release upload "$TAG" ".output/signed/$xpi"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
